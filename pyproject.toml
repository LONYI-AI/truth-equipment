[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-agent"
version = "0.3.0"
description = "Physical Agent OS — Safety Kernel + Runtime (M0 Foundation)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

# DeepSeek Harness SDK：exact prerelease（P0-1/P0-13），仅 Linux x64/arm64、macOS arm64
harness = [
    "deepseek-harness-sdk==0.1.0rc6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"physical_agent" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
ignore_missing_imports = true

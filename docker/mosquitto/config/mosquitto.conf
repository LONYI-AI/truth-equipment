# ============================================================
# Mosquitto MQTT Broker 配置
# ============================================================
# ADR-0009: M1 阶段不启用！仅在需要时使用此配置。
# 启用前必须：
#   1. 创建 password_file（见 scripts/generate_mqtt_passwords.sh）
#   2. 配置 acl.file 定义权限
#   3. 取消 docker/compose.core.yml 中 mosquitto 服务的注释
# ============================================================

# 监听端口
listener 1883

# ✅ 禁止匿名访问（任务书原 allow_anonymous true 是 Critical 安全错误）
allow_anonymous false

# 密码文件路径（容器内路径）
password_file /mosquitto/config/password_file

# ACL 文件路径（容器内路径）
acl_file /mosquitto/config/acl.file

# 持久化存储
persistence true
persistence_location /mosquitto/data

# 日志
log_dest file /mosquitto/log/mosquitto.log
log_type all
# log_dest stdout  # 取消注释以同时输出到 stdout（Docker logs 可见）

# 连接安全（未来启用 TLS 时取消注释）
# listener 8883
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key

# WebSocket（HA 有时需要，可选）
# listener 9001
# protocol websockets

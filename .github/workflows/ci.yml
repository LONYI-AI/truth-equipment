name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,harness]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Typecheck (mypy)
        run: mypy src

      - name: Test (pytest, excluding harness smoke)
        run: pytest -q -m "not harness_smoke"

      - name: Coverage
        run: pytest --cov=physical_agent --cov-report=term-missing -q -m "not harness_smoke"

      - name: Runtime conformance
        run: pytest tests/runtime-conformance/ -q -m "not harness_smoke"

      - name: DeepSeek Harness smoke test (real SDK + local model proxy)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/runtime-conformance
          {
            echo "OS: $(. /etc/os-release && echo \"$PRETTY_NAME\")"
            echo "Python: $(python --version)"
            echo "deepseek-harness-sdk: $(python -c 'import importlib.metadata as m; print(m.version("deepseek-harness-sdk"))')"
            echo "Commit SHA: $(git rev-parse HEAD)"
            echo "Test result:"
            pytest -m harness_smoke -q -v
          } 2>&1 | tee evidence/runtime-conformance/harness-smoke-linux.txt

      - name: Upload Linux Harness smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-smoke-linux
          path: evidence/runtime-conformance/harness-smoke-linux.txt
          if-no-files-found: error

      - name: Policy bypass tests
        run: pytest tests/security/ -q

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository consistency
        run: python scripts/check_repo_consistency.py

      - name: Docker compose config
        run: docker compose config
